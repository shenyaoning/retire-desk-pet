name: Build desktop installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build Debian package
        run: npm run tauri build -- --bundles deb
      - name: Check package architecture and dependencies
        shell: bash
        run: |
          set -euo pipefail
          package=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = "${{ matrix.arch }}"
          dpkg-deb -f "$package" Depends | grep -q 'libwebkit2gtk-4.1'
          dpkg-deb -c "$package" | grep '/usr/bin/retire-desk-pet$'
      - name: Publish Linux package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "退休桌宠 ${{ github.ref_name }}（试用版）"
          body: "Windows 与 Linux 安装包。Linux 包按处理器架构选 amd64 或 arm64；安装需系统提供 WebKitGTK 4.1。数据只保存在本机。"
          prerelease: true
          files: src-tauri/target/release/bundle/deb/*.deb
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build installer
        shell: pwsh
        run: |
          npm run tauri build -- --bundles nsis 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content build.log -Tail 70 | Out-String)
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=build log tail::$tail"
            exit 1
          }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "退休桌宠 ${{ github.ref_name }}（试用版）"
          body: "Windows 与 Linux 安装包。Linux 包按处理器架构选 amd64 或 arm64；安装需系统提供 WebKitGTK 4.1。数据只保存在本机。"
          prerelease: true
          files: src-tauri/target/release/bundle/nsis/*.exe
