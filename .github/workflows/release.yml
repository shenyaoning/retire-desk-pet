name: Build Windows installer

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "退休桌宠 ${{ github.ref_name }}（Windows，试用版）"
          releaseBody: "Windows 安装包（未签名，首次运行会出现蓝色提示，选「更多信息 → 仍要运行」）。数据只保存在本机，不联网。"
          releaseDraft: false
          prerelease: true
          args: --bundles nsis
